name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    # Tests never launch a browser; skipping the download avoids multi-hundred-MB
    # fetches that stall on runners (puppeteer 21 reads this exact var name)
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: "1234"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: file-server

      # Sibling checkouts must match the package.json pins — otherwise the
      # Docker build compiles against a stale toolkit and drifts every time
      # a dependency is bumped. ($GITHUB_ENV is visible only to subsequent
      # steps, so this runs before the sibling checkout.)
      - name: Resolve sibling pins from package.json
        run: |
          echo "TOOLKIT_REF=$(node -p "require('./file-server/package.json').dependencies['api-server-toolkit'].split('#')[1]")" >> $GITHUB_ENV

      # Dockerfile copies the toolkit from a sibling directory
      - uses: actions/checkout@v4
        with:
          repository: fwmakc/api-server-toolkit
          ref: ${{ env.TOOLKIT_REF }}
          path: api-server-toolkit

      # dist/ is gitignored in the toolkit — build it for the Docker COPY
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build toolkit
        run: cd api-server-toolkit && npm install --legacy-peer-deps --ignore-scripts && npx tsc

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: file-server/Dockerfile
          push: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # Runtime dependencies only; high/critical fails the build unless a
      # dated, justified allowlist entry exists in the script itself.
      - name: Dependency audit gate (high/critical, runtime)
        run: node scripts/audit-gate.mjs

      # Software bill of materials, shipped as a CI artifact on every push
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
